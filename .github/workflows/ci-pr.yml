name: Pull Request CI

on:
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Code quality checks
  code-quality:
    name: Code Quality
    uses: ./.github/workflows/_reusable-code-quality.yml
    with:
      python-version: "3.11"

  # Run the suite once so coverage is combined consistently.
  tests:
    name: Tests and Coverage
    uses: ./.github/workflows/_reusable-tests.yml
    with:
      python-version: "3.11"
      test-type: all
      coverage-threshold: 90

  # PR summary
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [code-quality, tests]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Generate PR summary
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const codeQualityResult = '${{ needs.code-quality.result }}';
            const testsResult = '${{ needs.tests.result }}';
            const allPassed = codeQualityResult === 'success' && testsResult === 'success';

            const summary = `## CI/CD Pipeline Results

            ### Job Status
            - **Code Quality**: ${codeQualityResult}
            - **Tests and Coverage**: ${testsResult}

            ### Next Steps
            ${allPassed
              ? '✅ All checks passed! Ready for review.'
              : '❌ Some checks failed. Please review the logs and fix the issues.'}

            ---
            *Triggered by: @${{ github.actor }}*
            *Commit: ${{ github.sha }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
