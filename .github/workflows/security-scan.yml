name: Security Scanning

on:
  schedule:
    # Run security scans every day at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - "Dockerfile*"
      - ".github/workflows/**"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # Python dependency scanning
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    outputs:
      vulnerability-findings: ${{ steps.audit.outputs.findings }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime requirements
        id: audit
        shell: bash
        run: |
          if pip-audit --requirement requirements.txt --desc --format json --output pip-audit-report.json; then
            echo "findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            audit_status=$?
          fi

          if [[ "$audit_status" -eq 1 ]] && \
            python -c "import json; report=json.load(open('pip-audit-report.json')); raise SystemExit(not any(dep.get('vulns') for dep in report.get('dependencies', [])))"; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency vulnerabilities detected::See the uploaded pip-audit report; existing findings are being triaged before enabling a blocking gate."
            exit 0
          fi

          exit "$audit_status"

      - name: Upload security reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-reports
          path: |
            pip-audit-report.json
          retention-days: 30

  # Code security scanning
  code-scan:
    name: Code Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -c pyproject.toml

      - name: Upload Bandit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # SAST with Semgrep
  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
            p/ci
          generateSarif: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Docker image scanning
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build -t sentiment-service:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentiment-service:scan
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy in table mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentiment-service:scan
          format: "table"
          severity: "CRITICAL,HIGH"

      - name: Run Grype scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: sentiment-service:scan
          fail-build: false
          severity-cutoff: high

  # Secret scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Generate security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-scan, sast-scan, docker-scan, secret-scan]
    if: always()

    steps:
      - name: Generate security summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Scan**: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Code Scan**: ${{ needs.code-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SAST Scan**: ${{ needs.sast-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Scan**: ${{ needs.docker-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Secret Scan**: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Known dependency vulnerabilities**: ${{ needs.dependency-scan.outputs.vulnerability-findings }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.dependency-scan.result }}" == "failure" ] || \
             [ "${{ needs.code-scan.result }}" == "failure" ] || \
             [ "${{ needs.sast-scan.result }}" == "failure" ] || \
             [ "${{ needs.docker-scan.result }}" == "failure" ] || \
             [ "${{ needs.secret-scan.result }}" == "failure" ]; then
            echo "⚠️ **Some security scans failed. Please review the detailed reports.**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.dependency-scan.outputs.vulnerability-findings }}" == "true" ]; then
            echo "⚠️ **Known dependency vulnerabilities were found. Review the uploaded report; the gate remains report-only until the existing baseline is triaged.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All security scans passed successfully.**" >> $GITHUB_STEP_SUMMARY
          fi
